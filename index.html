<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Familie Karlshaus</title>
<style>
  :root{
    --bg:#f5f4f1; --card:#ffffff; --text:#20201d; --muted:#6b675f;
    --accent:#8a5a2b; --accent-text:#ffffff; --border:#e3e0d8; --danger:#b3432b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181715; --card:#232220; --text:#f0eee9; --muted:#a39c8f;
      --accent:#c98a4b; --accent-text:#181715; --border:#39362f; --danger:#e0705a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--border);
  }
  h1{font-size:19px; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px}
  h1 span.title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .icon-btn{
    background:none; border:none; color:var(--muted); font-size:20px; padding:4px 6px;
    cursor:pointer; line-height:1;
  }
  .search-row{display:flex; gap:8px}
  input[type=text], input[type=password], input[type=date], select, textarea{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:15px; font-family:inherit;
  }
  textarea{resize:vertical}
  main{padding:12px 16px 40px; max-width:640px; margin:0 auto}
  @media (min-width:760px){ main{max-width:min(1900px, 98vw)} }
  .hint{color:var(--muted); font-size:13px; padding:24px 4px; text-align:center}
  .list{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .row{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .row:active{opacity:.7}
  .row .name{font-weight:600}
  .row .sub{color:var(--muted); font-size:13px}
  .chip{
    display:inline-flex; align-items:center; background:var(--bg); border:1px solid var(--border);
    color:var(--text); border-radius:999px; padding:6px 12px; font-size:13.5px; cursor:pointer; margin:3px 4px 0 0;
  }
  .chip:active{opacity:.7}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px;
  }
  .card h2{margin:0 0 4px; font-size:22px}
  .card .meta{color:var(--muted); font-size:14px; margin-bottom:2px}
  .section-label{
    text-transform:uppercase; letter-spacing:.03em; font-size:11.5px; color:var(--muted);
    margin:16px 0 6px; font-weight:600;
  }
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:15px; cursor:pointer; padding:6px 0 12px;
    display:flex; align-items:center; gap:4px;
  }
  .tree{margin:10px 0 20px}
  .trow{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
  .tunion{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center}
  .tunion .sep{color:var(--muted); font-size:14px}
  .tconn{width:2px; height:16px; background:var(--border); margin:2px auto}
  .tnode{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:7px 11px; font-size:13px; text-align:center; cursor:pointer; min-width:64px;
  }
  .tnode:active{opacity:.7}
  .tnode .yr{font-size:10.5px; opacity:.7; margin-top:1px}
  .tnode.self{border:2px solid var(--accent); font-weight:700; background:var(--accent); color:var(--accent-text)}
  .fab{
    position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-text);
    border:none; font-size:28px; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; z-index:6;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end;
    justify-content:center; z-index:10;
  }
  @media (min-width:520px){ .modal-overlay{align-items:center} }
  .modal{
    background:var(--card); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto;
  }
  @media (min-width:520px){ .modal{border-radius:16px} }
  .modal.wide{max-width:720px}
  @media (min-width:820px){ .modal.wide{max-width:900px} }
  .modal h3{margin-top:0}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px}
  .btn{
    padding:11px 16px; border-radius:10px; border:none; background:var(--accent); color:var(--accent-text);
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn.secondary{background:none; color:var(--text); border:1px solid var(--border)}
  .btn.danger{background:none; color:var(--danger); border:1px solid var(--danger)}
  .btn-row{display:flex; gap:10px; margin-top:18px; flex-wrap:wrap}
  .error{color:var(--danger); font-size:13.5px; margin-top:10px}
  .loading{color:var(--muted); text-align:center; padding:30px 0}
  .savebar{
    position:sticky; top:96px; z-index:4; background:var(--danger); color:#fff;
    padding:10px 14px; border-radius:10px; margin:0 16px 10px; font-size:13.5px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; max-width:608px; margin-left:auto; margin-right:auto;
  }
  .savebar button{background:#fff; color:var(--danger); border:none; border-radius:8px; padding:7px 12px; font-weight:700; cursor:pointer}
  .pindots{display:flex; justify-content:center; gap:12px; margin:18px 0}
  .pindots span{width:16px; height:16px; border-radius:50%; border:2px solid var(--border); display:inline-block}
  .pindots span.filled{background:var(--accent); border-color:var(--accent)}
  .pinpad{display:grid; grid-template-columns:repeat(3,64px); gap:12px; justify-content:center; margin:0 auto}
  .pinpad button{
    width:64px; height:64px; border-radius:50%; border:1px solid var(--border); background:var(--card);
    color:var(--text); font-size:22px; cursor:pointer;
  }
  .pinpad button:active{background:var(--bg)}
  .pinpad .empty{visibility:hidden}
.tablewrap{display:none}
.scrollToolbar{display:none}
.cardlist{display:block}
@media (min-width:760px){
  .tablewrap{display:block}
  .scrollToolbar{display:flex}
  .cardlist{display:none}
}
  .scrollToolbar{
    justify-content:flex-end; gap:8px; margin-top:12px;
    position:sticky; top:var(--stickyTop, 0px); z-index:4; background:var(--bg); padding:4px 0;
  }
  .scrollBtn{
    width:40px; height:36px; border-radius:8px;
    border:1px solid var(--border); background:var(--card); color:var(--text); font-size:16px; cursor:pointer;
  }
  .scrollBtn:active{background:var(--bg)}
  .tablewrap{
    overflow:auto; max-height:65vh; border:1px solid var(--border); border-radius:12px; max-width:100%;
    scrollbar-width:auto; scrollbar-color:var(--accent) var(--bg);
  }
  .tablewrap::-webkit-scrollbar{height:14px; width:14px}
  .tablewrap::-webkit-scrollbar-track{background:var(--bg)}
  .tablewrap::-webkit-scrollbar-thumb{background:var(--accent); border-radius:7px}
  table.datatable{border-collapse:collapse; width:100%; font-size:13px; table-layout:fixed}
  table.datatable th, table.datatable td{
    padding:8px 11px; border:1px solid var(--border); text-align:left; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; position:relative;
  }
  table.datatable td.wrapcell{white-space:normal; overflow:visible; text-overflow:clip; word-break:break-word; vertical-align:top}
  table.datatable th{cursor:grab; user-select:none; background:var(--bg)}
  table.datatable th.dragging{opacity:.4}
  table.datatable th:hover{background:var(--border)}
  table.datatable th .arrow{opacity:.6; font-size:11px; margin-left:4px; cursor:pointer}
  table.datatable thead tr.headRow th{position:sticky; top:0; z-index:2}
  table.datatable thead tr.filterRow th{
    position:sticky; top:var(--headRowH, 38px); z-index:2; background:var(--card); padding:4px 6px; cursor:default;
  }
  table.datatable thead tr.filterRow th:hover{background:var(--card)}
  input.colFilterInput{
    width:100%; padding:5px 7px; font-size:12px; border-radius:6px; border:1px solid var(--border);
    background:var(--bg); color:var(--text); font-family:inherit;
  }
  table.datatable th:first-child, table.datatable td:first-child{position:sticky; left:0; z-index:1; background:var(--card)}
  table.datatable thead th:first-child{z-index:3}
  table.datatable tr.datarow{cursor:pointer}
  table.datatable tr.datarow:hover{background:var(--bg)}
  table.datatable tr.datarow:active{opacity:.7}
  .colResizer{
    position:absolute; top:0; right:0; width:8px; height:100%; cursor:col-resize; z-index:5;
  }
  .colResizer:hover, .colResizer.resizing{background:var(--accent)}
  .advsearch{display:flex; flex-direction:column; gap:8px; margin-top:8px}
  .advsearch .pair{display:flex; gap:8px}
  .advsearch select{flex:0 0 42%}
  @media print{
    header, .fab, #modalRoot, #saveBarRoot, .scrollToolbar, .hint, .back-btn, .tree, .btn-row{ display:none !important; }
    body{ background:#fff; color:#000; }
    main{ max-width:none !important; padding:0 !important; }
    .cardlist{ display:none !important; }
    .tablewrap{ display:block !important; overflow:visible !important; max-height:none !important; border:none !important; }
    table.datatable{ table-layout:auto !important; font-size:10px; width:100% !important; }
    table.datatable th, table.datatable td{
      white-space:normal !important; overflow:visible !important; text-overflow:clip !important;
      position:static !important; border:1px solid #999 !important;
    }
    table.datatable thead tr.filterRow{ display:none !important; }
    @page { size: A4 landscape; margin: 10mm; }
  }
</style>
</head>
<body>

<header>
  <h1><span class="title">🌳 Familie Karlshaus</span>
    <span style="display:flex; gap:4px; flex-shrink:0">
      <button class="icon-btn" id="printBtn" title="Drucken">🖨️</button>
      <button class="icon-btn" id="saveBtn" title="Speichern">💾</button>
      <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙️</button>
    </span>
  </h1>
  <div class="meta" style="margin:-6px 0 8px" id="versionLabel"></div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Suche über alle Felder (Name, Wohnort, Beruf, Datum, Bemerkung…)" autocomplete="off">
  </div>
  <div class="search-row" style="margin-top:8px">
    <select id="sortFieldSelect" style="flex:1"></select>
    <button class="btn secondary" id="sortDirBtn" style="width:52px; flex:0 0 auto">▲</button>
  </div>
</header>

<div id="saveBarRoot"></div>

<main id="main">
  <div class="hint">Lade Daten…</div>
</main>

<button class="fab" id="fabBtn" title="Neue Person erfassen">+</button>

<div id="modalRoot"></div>

<script>
document.getElementById("versionLabel").textContent = "v23 · Stand: 26.09.2026, 11:26 Uhr";

const LS_KEY = "familie_karlshaus_config_v2";
const UNLOCK_KEY = "familie_karlshaus_unlocked";
const DATA_FILE = "daten.json";

function loadConfig(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; }
}
function saveConfig(cfg){
  localStorage.setItem(LS_KEY, JSON.stringify(cfg));
}
let config = loadConfig();

const DEFAULT_PW_HASH = "08f78996d1305172a91760c98ad43f3c5bdbdac8aba9edec8e56fe3e7ab6c95b";

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}
function activePwHash(){
  return config.pwHash || DEFAULT_PW_HASH;
}
function isUnlocked(){
  return localStorage.getItem(UNLOCK_KEY) === activePwHash();
}

function renderPinPad(container, title, onComplete){
  let entered = "";
  container.innerHTML = `
    <div class="hint" style="padding-top:40px">
      <div style="font-size:32px; margin-bottom:8px">🔒</div>
      <div style="margin-bottom:6px">${title}</div>
      <div class="pindots" id="pinDots">${"".padEnd(6,"o").split("").map(()=>'<span></span>').join("")}</div>
      <div class="pinpad" id="pinPad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join("")}
        <button class="empty"></button>
        <button data-n="0">0</button>
        <button data-n="back">⌫</button>
      </div>
      <div class="error" id="pinError" style="display:none; margin-top:14px"></div>
    </div>`;
  const dots = () => container.querySelectorAll("#pinDots span").forEach((el,i) => el.classList.toggle("filled", i < entered.length));
  container.querySelectorAll("#pinPad button[data-n]").forEach(btn => {
    btn.addEventListener("click", async () => {
      const n = btn.dataset.n;
      if (n === "back") { entered = entered.slice(0,-1); dots(); return; }
      if (entered.length >= 6) return;
      entered += n;
      dots();
      if (entered.length === 6) {
        const ok = await onComplete(entered);
        if (!ok) {
          const err = container.querySelector("#pinError");
          if (err) { err.textContent = "Falsches Passwort."; err.style.display = "block"; }
          entered = "";
          dots();
        }
      }
    });
  });
}

let state = { personen: [], personById: {}, loaded: false, error: null, dirty: false };
let currentPersonId = null;
let lastFocusPersonId = null;
let sortState = { key: "vorname", dir: 1 };
const COL_ORDER_KEY = "familie_karlshaus_colorder";
let columnOrder = (() => {
  try { return JSON.parse(localStorage.getItem(COL_ORDER_KEY)) || null; } catch(e) { return null; }
})();

const FIELDS = [
  {key:"vorname", label:"Vorname"},
  {key:"maedchenname", label:"Mädchenname"},
  {key:"geburtsdatum", label:"geboren", type:"date"},
  {key:"todesdatum", label:"verstorben", type:"date"},
  {key:"beruf", label:"Beruf"},
  {key:"wohnorte", label:"Wohnorte"},
  {key:"zweig", label:"Zweig"},
  {key:"ehepartner", label:"verheiratet mit"},
  {key:"erwaehnt", label:"Erwähnt"},
  {key:"bemerkungen", label:"Bemerkungen"},
  {key:"pruefen", label:"Prüfen?"},
];
const FIELDS_BY_KEY = Object.fromEntries(FIELDS.map(f => [f.key, f]));
const WRAP_KEYS = ["wohnorte", "beruf", "bemerkungen"];
const VALID_KEYS = new Set(FIELDS.map(f => f.key));
if (!columnOrder || columnOrder.length !== FIELDS.length
    || columnOrder.some(k => !VALID_KEYS.has(k)) || new Set(columnOrder).size !== VALID_KEYS.size) {
  columnOrder = FIELDS.map(f => f.key);
  localStorage.setItem(COL_ORDER_KEY, JSON.stringify(columnOrder));
}
function orderedFields(){ return columnOrder.map(k => FIELDS_BY_KEY[k]); }
function moveColumn(key, beforeKey){
  columnOrder = columnOrder.filter(k => k !== key);
  const idx = beforeKey ? columnOrder.indexOf(beforeKey) : columnOrder.length;
  columnOrder.splice(idx < 0 ? columnOrder.length : idx, 0, key);
  localStorage.setItem(COL_ORDER_KEY, JSON.stringify(columnOrder));
}

const COL_WIDTH_KEY = "familie_karlshaus_colwidths";
const DEFAULT_COL_WIDTH = 140;
let colWidths = (() => {
  try { return JSON.parse(localStorage.getItem(COL_WIDTH_KEY)) || {}; } catch(e) { return {}; }
})();
function widthFor(key){ return colWidths[key] || DEFAULT_COL_WIDTH; }
function setWidth(key, px){
  colWidths[key] = Math.max(50, Math.round(px));
  localStorage.setItem(COL_WIDTH_KEY, JSON.stringify(colWidths));
}

function fmtDate(d){
  if (!d) return "";
  const [y,m,day] = d.split("-");
  return `${day}.${m}.${y}`;
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function personName(id){
  const p = state.personById[id];
  if (!p) return "(unbekannt)";
  return p.vorname || "";
}
function rebuildIndex(){
  state.personById = {};
  state.personen.forEach(p => state.personById[p.id] = p);
}
function nextId(){
  let max = 0;
  state.personen.forEach(p => { const n = parseInt(String(p.id).replace(/\D/g,""),10); if (n > max) max = n; });
  return "p" + (max + 1);
}
let autoSaveTimer = null;
function markDirty(){
  state.dirty = true;
  updateSaveBtn();
  if (config.ghToken) {
    clearTimeout(autoSaveTimer);
    setSaveStatus("Änderung erkannt – speichere in ein paar Sekunden automatisch…");
    autoSaveTimer = setTimeout(() => { if (state.dirty) saveToGitHub(); }, 4000);
  }
}
const GH_OWNER = "bastiankarlshaus";
const GH_REPO = "familie-karlshaus";
const GH_BRANCH = "main";
const GH_PATH = "daten.json";

function updateSaveBtn(){
  const btn = document.getElementById("saveBtn");
  if (!btn) return;
  btn.style.background = state.dirty ? "var(--accent)" : "none";
  btn.style.borderRadius = state.dirty ? "8px" : "0";
  btn.title = state.dirty ? "Änderungen speichern" : "Keine Änderungen";
}
function setSaveStatus(msg){
  document.getElementById("saveBarRoot").innerHTML = msg ? `<div class="savebar">${msg}</div>` : "";
}
function downloadData(){
  const blob = new Blob([JSON.stringify(state.personen, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "daten.json";
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  state.dirty = false;
  updateSaveBtn();
}

async function handleSaveClick(){
  if (!state.dirty) return;
  clearTimeout(autoSaveTimer);
  if (!config.ghToken) {
    setSaveStatus("Kein GitHub-Token hinterlegt – Datei wird heruntergeladen, bitte manuell bei GitHub hochladen (oder in ⚙️ einen Token eintragen für direktes Speichern).");
    downloadData();
    setTimeout(() => setSaveStatus(""), 6000);
    return;
  }
  await saveToGitHub();
}

async function saveToGitHub(){
  setSaveStatus("Speichere…");
  const api = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_PATH}`;
  try {
    const getRes = await fetch(`${api}?ref=${GH_BRANCH}`, {
      headers: { Authorization: `Bearer ${config.ghToken}`, Accept: "application/vnd.github+json" },
    });
    if (!getRes.ok) throw new Error(`Aktuelle Datei nicht lesbar (${getRes.status}). Token/Berechtigung prüfen.`);
    const sha = (await getRes.json()).sha;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(state.personen, null, 2))));
    const putRes = await fetch(api, {
      method: "PUT",
      headers: {
        Authorization: `Bearer ${config.ghToken}`,
        Accept: "application/vnd.github+json",
        "Content-Type": "application/json",
      },
      body: JSON.stringify({ message: "Familiendaten aktualisiert", content, sha, branch: GH_BRANCH }),
    });
    if (!putRes.ok) {
      const t = await putRes.text();
      throw new Error(`Speichern fehlgeschlagen (${putRes.status}): ${t.slice(0,200)}`);
    }
    state.dirty = false;
    updateSaveBtn();
    setSaveStatus("Gespeichert! Kann 1-2 Minuten dauern, bis GitHub Pages die neue Version ausliefert.");
    setTimeout(() => setSaveStatus(""), 6000);
  } catch (err) {
    setSaveStatus(err.message);
  }
}

async function loadAll(){
  state.error = null; state.loaded = false; render();
  try {
    const res = await fetch(DATA_FILE, {cache: "no-store"});
    if (!res.ok) throw new Error(`Konnte ${DATA_FILE} nicht laden (${res.status}). Liegt die Datei im selben Ordner wie index.html?`);
    state.personen = await res.json();
    rebuildIndex();
    state.loaded = true;
  } catch (err) {
    state.error = err.message;
  }
  render();
}

function renderGate(){
  const main = document.getElementById("main");
  renderPinPad(main, "Bitte PIN eingeben", async (pin) => {
    const hash = await sha256Hex(pin);
    if (hash === activePwHash()) {
      localStorage.setItem(UNLOCK_KEY, hash);
      loadAll();
      return true;
    }
    return false;
  });
}

function renderSettingsModal(){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <h3>Einstellungen</h3>
        <button class="btn secondary" id="cfgChangePin" style="width:100%; margin-bottom:10px">PIN ändern</button>
        ${config.pwHash ? `<button class="btn secondary" id="cfgRemovePw" style="width:100%; margin-bottom:10px">Auf Standard-PIN zurücksetzen</button>` : ""}
        <button class="btn secondary" id="cfgDownload" style="width:100%; margin-bottom:10px">daten.json herunterladen</button>
        <hr style="border:none; border-top:1px solid var(--border); margin:16px 0">
        <div class="field">
          <label>GitHub-Token für direktes Speichern (optional)</label>
          <input type="password" id="cfgGhToken" value="${config.ghToken||""}" placeholder="github_pat_...">
        </div>
        <div class="meta" style="margin-bottom:10px">Fine-grained Token, nur für Repo "familie-karlshaus", Berechtigung "Contents: Read and write".</div>
        <div class="btn-row" style="margin-top:0; margin-bottom:16px">
          <button class="btn secondary" id="cfgSaveGhToken">Token speichern</button>
          ${config.ghToken ? `<button class="btn danger" id="cfgRemoveGhToken">Token entfernen</button>` : ""}
        </div>
        <div class="btn-row"><button class="btn secondary" id="cfgCancel">Schließen</button></div>
      </div>
    </div>`;
  wireOverlayClose(document.getElementById("overlay"));
  document.getElementById("cfgCancel").addEventListener("click", closeModal);
  document.getElementById("cfgDownload").addEventListener("click", downloadData);
  document.getElementById("cfgSaveGhToken").addEventListener("click", () => {
    const val = document.getElementById("cfgGhToken").value.trim();
    if (val) config.ghToken = val; else delete config.ghToken;
    saveConfig(config);
    closeModal();
    updateSaveBtn();
  });
  const removeGhBtn = document.getElementById("cfgRemoveGhToken");
  if (removeGhBtn) removeGhBtn.addEventListener("click", () => {
    delete config.ghToken;
    saveConfig(config);
    closeModal();
    updateSaveBtn();
  });
  const removeBtn = document.getElementById("cfgRemovePw");
  if (removeBtn) removeBtn.addEventListener("click", () => {
    delete config.pwHash;
    saveConfig(config);
    localStorage.setItem(UNLOCK_KEY, DEFAULT_PW_HASH);
    closeModal();
    render();
  });
  document.getElementById("cfgChangePin").addEventListener("click", () => {
    const overlay = document.getElementById("overlay");
    overlay.innerHTML = `<div class="modal" id="pinModal"></div>`;
    renderPinPad(document.getElementById("pinModal"), "Neue PIN eingeben", async (pin) => {
      config.pwHash = await sha256Hex(pin);
      saveConfig(config);
      localStorage.setItem(UNLOCK_KEY, config.pwHash);
      closeModal();
      return true;
    });
  });
}

function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
}

function wireOverlayClose(overlay){
  let downOnOverlay = false;
  overlay.addEventListener("mousedown", (e) => { downOnOverlay = (e.target === overlay); });
  overlay.addEventListener("click", (e) => {
    if (e.target === overlay && downOnOverlay) closeModal();
    downOnOverlay = false;
  });
}

function deletePerson(id){
  if (!confirm(`${personName(id)} wirklich löschen?`)) return;
  state.personen = state.personen.filter(x => x.id !== id);
  state.personen.forEach(x => {
    if (x.mutter === id) x.mutter = null;
    if (x.vater === id) x.vater = null;
  });
  rebuildIndex();
  markDirty();
  currentPersonId = null;
  render();
}

function renderPersonForm(editId){
  const p = editId ? state.personById[editId] : null;
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal wide">
        <h3>${p ? "Person bearbeiten" : "Neue Person"}</h3>
        <div class="field"><label>Vorname</label><input type="text" id="pfVorname" value="${p ? escapeHtml(p.vorname||"") : ""}"></div>
        <div class="field"><label>Mädchenname (falls abweichend)</label><input type="text" id="pfMaedchenname" value="${p ? escapeHtml(p.maedchenname||"") : ""}"></div>
        <div class="field"><label>Geburtsdatum</label><input type="date" id="pfGeburtsdatum" value="${p ? p.geburtsdatum||"" : ""}"></div>
        <div class="field"><label>Todesdatum</label><input type="date" id="pfTodesdatum" value="${p ? p.todesdatum||"" : ""}"></div>
        <div class="field"><label>Beruf</label><input type="text" id="pfBeruf" value="${p ? escapeHtml(p.beruf||"") : ""}"></div>
        <div class="field"><label>Wohnorte (Freitext, ein Eintrag pro Zeile)</label><textarea id="pfWohnorte" rows="5">${p ? escapeHtml(p.wohnorte||"") : ""}</textarea></div>
        <div class="field"><label>Zweig</label><input type="text" id="pfZweig" value="${p ? escapeHtml(p.zweig||"") : ""}"></div>
        <div class="field"><label>Erwähnt (z.B. "1890–1933")</label><input type="text" id="pfErwaehnt" value="${p ? escapeHtml(p.erwaehnt||"") : ""}" placeholder="z.B. 1890–1933"></div>
        <div class="field"><label>verheiratet mit</label><input type="text" id="pfEhepartner" value="${p ? escapeHtml(p.ehepartner||"") : ""}"></div>
        <div class="field"><label>Bemerkungen</label><textarea id="pfBemerkungen" rows="4">${p ? escapeHtml(p.bemerkungen||"") : ""}</textarea></div>
        <div class="field"><label style="display:flex; align-items:center; gap:8px; cursor:pointer">
          <input type="checkbox" id="pfPruefen" ${p && p.pruefen ? "checked" : ""} style="width:auto">
          ⚠️ Diese Daten müssen noch überprüft werden
        </label></div>
        <div class="btn-row">
          <button class="btn" id="pfSave">Speichern</button>
          <button class="btn secondary" id="pfCancel">Abbrechen</button>
          ${p ? `<button class="btn danger" id="pfDelete">Person löschen</button>` : ""}
        </div>
      </div>
    </div>`;
  wireOverlayClose(document.getElementById("overlay"));
  document.getElementById("pfCancel").addEventListener("click", closeModal);
  const delBtn = document.getElementById("pfDelete");
  if (delBtn) delBtn.addEventListener("click", () => { closeModal(); deletePerson(editId); });

  function collectAndSave(){
    const data = {
      vorname: document.getElementById("pfVorname").value.trim(),
      maedchenname: document.getElementById("pfMaedchenname").value.trim(),
      geburtsdatum: document.getElementById("pfGeburtsdatum").value,
      todesdatum: document.getElementById("pfTodesdatum").value,
      beruf: document.getElementById("pfBeruf").value.trim(),
      wohnorte: document.getElementById("pfWohnorte").value.trim(),
      zweig: document.getElementById("pfZweig").value.trim(),
      erwaehnt: document.getElementById("pfErwaehnt").value.trim(),
      ehepartner: document.getElementById("pfEhepartner").value.trim(),
      bemerkungen: document.getElementById("pfBemerkungen").value.trim(),
      pruefen: document.getElementById("pfPruefen").checked ? "ja" : "",
    };
    if (!data.vorname) { alert("Bitte mindestens einen Vornamen eingeben."); return null; }
    let savedId;
    if (p) {
      Object.assign(p, data);
      savedId = p.id;
    } else {
      savedId = nextId();
      state.personen.push({ id: savedId, mutter: null, vater: null, ...data });
    }
    rebuildIndex();
    markDirty();
    return savedId;
  }

  document.getElementById("pfSave").addEventListener("click", () => {
    const savedId = collectAndSave();
    if (!savedId) return;
    closeModal();
    currentPersonId = savedId;
    render();
  });
}

function render(){
  const main = document.getElementById("main");
  if (state.error) { main.innerHTML = `<div class="hint error">${escapeHtml(state.error)}</div>`; return; }
  if (!state.loaded) { main.innerHTML = `<div class="loading">Lade Familiendaten…</div>`; return; }
  if (currentPersonId) { renderDetail(currentPersonId); return; }
  renderList();
}

function fieldValueForFilter(p, key){
  if (key === "geburtsdatum" || key === "todesdatum") return p[key] ? fmtDate(p[key]) : "";
  return (p[key] || "").toString();
}
function sortValue(p, key){
  return fieldValueForFilter(p, key);
}
function searchBlob(p){
  return (FIELDS.map(f => fieldValueForFilter(p, f.key)).join(" ") + " " + personName(p.id)).toLowerCase();
}

let columnFilters = {};
let activeFilterKey = null;
let filterDebounce = null;

function renderList(){
  const main = document.getElementById("main");
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  let items = state.personen.map(p => ({ p, name: personName(p.id) }));
  items = items.filter(x => !q || searchBlob(x.p).includes(q));
  items = items.filter(x => Object.entries(columnFilters).every(([k,v]) => !v || fieldValueForFilter(x.p, k).toLowerCase().includes(v.toLowerCase())));
  items.sort((a,b) => sortValue(a.p, sortState.key).localeCompare(sortValue(b.p, sortState.key), "de", {numeric:true}) * sortState.dir);

  if (items.length === 0) {
    main.innerHTML = `<div class="hint">Keine Treffer.</div>`;
  } else {
    main.innerHTML = `<div class="hint">${items.length} von ${state.personen.length} Personen. Sortierung oben wählen, oder (Laptop/Tablet) Spaltenkopf antippen. Filterzeile unter den Überschriften.</div>`
      + tableHtml(items) + cardListHtml(items);
  }
  main.querySelectorAll("[data-person]").forEach(el => {
    el.addEventListener("click", () => { currentPersonId = el.dataset.person; render(); window.scrollTo(0,0); });
  });
  main.querySelectorAll("th[data-key]").forEach(el => {
    const arrow = el.querySelector(".arrow");
    if (arrow) arrow.addEventListener("click", (e) => {
      e.stopPropagation();
      const key = el.dataset.key;
      if (sortState.key === key) sortState.dir *= -1; else { sortState.key = key; sortState.dir = 1; }
      document.getElementById("sortFieldSelect").value = sortState.key;
      document.getElementById("sortDirBtn").textContent = sortState.dir === 1 ? "▲" : "▼";
      renderList();
    });
  });
  main.querySelectorAll(".colFilterInput").forEach(inp => {
    inp.addEventListener("input", () => {
      const key = inp.dataset.key;
      columnFilters[key] = inp.value;
      activeFilterKey = key;
      clearTimeout(filterDebounce);
      filterDebounce = setTimeout(() => { if (!currentPersonId) renderList(); }, 300);
    });
  });
  if (activeFilterKey) {
    const toFocus = main.querySelector(`.colFilterInput[data-key="${activeFilterKey}"]`);
    if (toFocus) { toFocus.focus(); const v = toFocus.value; toFocus.setSelectionRange(v.length, v.length); }
  }
  wireTableExtras();
  updateStickyOffsets();
  updateScrollToolbarVisibility();
  if (lastFocusPersonId) {
    const id = lastFocusPersonId;
    lastFocusPersonId = null;
    main.querySelectorAll(`[data-person="${id}"]`).forEach(el => {
      if (el.offsetParent !== null) el.scrollIntoView({block: "center"});
    });
  }
}

function updateScrollToolbarVisibility(){
  const wrap = document.getElementById("tableWrap");
  const toolbar = document.querySelector(".scrollToolbar");
  if (!wrap || !toolbar) return;
  const needsScroll = wrap.scrollWidth > wrap.clientWidth + 1;
  toolbar.style.display = needsScroll ? "flex" : "none";
}

function updateStickyOffsets(){
  const headerH = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--stickyTop", headerH + "px");
  const headRow = document.querySelector("tr.headRow");
  if (headRow) document.documentElement.style.setProperty("--headRowH", headRow.offsetHeight + "px");
}

function cellDisplay(p, key){
  if (key === "vorname") return (p.pruefen ? "⚠️ " : "") + personName(p.id);
  if (key === "pruefen") return p.pruefen ? "⚠️ ja" : "";
  if (key === "geburtsdatum" || key === "todesdatum") return p[key] ? fmtDate(p[key]) : "";
  if (key === "wohnorte" || key === "bemerkungen") return (p[key] || "").replace(/\n/g, ", ");
  return p[key] || "";
}

function cardListHtml(items){
  return `<div class="list cardlist">${items.map(({p}) => {
    const lines = [
      p.maedchenname ? `geb. ${p.maedchenname}` : null,
      (p.geburtsdatum || p.todesdatum) ? `${p.geburtsdatum ? "* "+fmtDate(p.geburtsdatum) : ""}${p.todesdatum ? " † "+fmtDate(p.todesdatum) : ""}` : null,
      p.beruf || null,
      p.ehepartner ? `⚭ ${p.ehepartner}` : null,
      p.wohnorte ? `🏠 ${p.wohnorte.replace(/\n/g, ", ")}` : null,
      p.zweig ? `Zweig: ${p.zweig}` : null,
      p.erwaehnt ? `Erwähnt ${p.erwaehnt}` : null,
      p.bemerkungen ? `📝 ${p.bemerkungen}` : null,
    ].filter(Boolean);
    return `<div class="row" data-person="${p.id}" style="align-items:flex-start; ${p.pruefen ? "background:rgba(230,160,40,.15)" : ""}">
      <div style="min-width:0">
        <div class="name">${p.pruefen ? "⚠️ " : ""}${escapeHtml(personName(p.id))}</div>
        ${lines.map(l => `<div class="sub">${escapeHtml(l)}</div>`).join("")}
      </div>
      <div class="sub">›</div>
    </div>`;
  }).join("")}</div>`;
}

function tableHtml(items){
  const cols = orderedFields();
  return `<div class="scrollToolbar">
    <button class="scrollBtn" id="scrollLeftBtn" title="Nach links">‹</button>
    <button class="scrollBtn" id="scrollRightBtn" title="Nach rechts">›</button>
  </div>
    <div class="tablewrap" id="tableWrap"><table class="datatable">
    <colgroup>${cols.map(c => `<col style="width:${widthFor(c.key)}px">`).join("")}</colgroup>
    <thead>
    <tr class="headRow">
    ${cols.map(c => `<th data-key="${c.key}" draggable="true">${c.label}<span class="arrow">${sortState.key === c.key ? (sortState.dir === 1 ? "▲" : "▼") : "⇅"}</span><div class="colResizer" data-key="${c.key}" draggable="false"></div></th>`).join("")}
    </tr>
    <tr class="filterRow">
    ${cols.map(c => `<th><input class="colFilterInput" data-key="${c.key}" placeholder="Filter…" value="${escapeHtml(columnFilters[c.key]||"")}"></th>`).join("")}
    </tr>
    </thead><tbody>
    ${items.map(({p}) => `<tr class="datarow" data-person="${p.id}" style="${p.pruefen ? "background:rgba(230,160,40,.15)" : ""}">${cols.map(c => `<td class="${WRAP_KEYS.includes(c.key) ? "wrapcell" : ""}">${escapeHtml(cellDisplay(p, c.key))}</td>`).join("")}</tr>`).join("")}
  </tbody></table></div>`;
}

function wireTableExtras(){
  const wrap = document.getElementById("tableWrap");
  if (!wrap) return;
  const leftBtn = document.getElementById("scrollLeftBtn");
  const rightBtn = document.getElementById("scrollRightBtn");
  if (leftBtn) leftBtn.addEventListener("click", () => wrap.scrollBy({left: -250, behavior: "smooth"}));
  if (rightBtn) rightBtn.addEventListener("click", () => wrap.scrollBy({left: 250, behavior: "smooth"}));

  let draggedKey = null;
  wrap.querySelectorAll("th[data-key]").forEach(th => {
    th.addEventListener("dragstart", () => { draggedKey = th.dataset.key; th.classList.add("dragging"); });
    th.addEventListener("dragend", () => th.classList.remove("dragging"));
    th.addEventListener("dragover", e => e.preventDefault());
    th.addEventListener("drop", e => {
      e.preventDefault();
      if (!draggedKey || draggedKey === th.dataset.key) return;
      moveColumn(draggedKey, th.dataset.key);
      renderList();
    });
  });

  wrap.querySelectorAll(".colResizer").forEach(handle => {
    handle.addEventListener("dragstart", e => e.preventDefault());
    handle.addEventListener("pointerdown", e => {
      e.preventDefault();
      e.stopPropagation();
      const key = handle.dataset.key;
      const col = wrap.querySelector(`col:nth-child(${cols_indexOf(key)+1})`);
      const startX = e.clientX;
      const startWidth = widthFor(key);
      handle.classList.add("resizing");
      handle.setPointerCapture(e.pointerId);
      const onMove = (ev) => {
        const newWidth = Math.max(50, startWidth + (ev.clientX - startX));
        if (col) col.style.width = newWidth + "px";
      };
      const onUp = (ev) => {
        const newWidth = Math.max(50, startWidth + (ev.clientX - startX));
        setWidth(key, newWidth);
        handle.classList.remove("resizing");
        window.removeEventListener("pointermove", onMove);
        window.removeEventListener("pointerup", onUp);
      };
      window.addEventListener("pointermove", onMove);
      window.addEventListener("pointerup", onUp);
    });
  });
  function cols_indexOf(key){ return orderedFields().findIndex(f => f.key === key); }
}

function tnode(id, isSelf){
  const p = state.personById[id];
  const year = p && p.geburtsdatum ? p.geburtsdatum.slice(0,4) : "";
  return `<div class="tnode${isSelf?' self':''}" data-person="${id}">
    <div>${escapeHtml(personName(id))}</div>
    ${year ? `<div class="yr">*${year}</div>` : ""}
  </div>`;
}
function chipsOrNone(ids){
  return ids.length ? ids.map(id => `<span class="chip" data-person="${id}">${escapeHtml(personName(id))}</span>`).join("") : `<div class="meta">Keine Angabe</div>`;
}
function parentsOf(p){ return [p.mutter, p.vater].filter(Boolean); }
function siblingsOf(id, p){
  if (!p.mutter && !p.vater) return [];
  const set = new Set();
  state.personen.forEach(other => {
    if (other.id === id) return;
    if ((p.mutter && other.mutter === p.mutter) || (p.vater && other.vater === p.vater)) set.add(other.id);
  });
  return [...set];
}
function childrenOf(id){
  return state.personen.filter(p => p.mutter === id || p.vater === id).map(p => p.id);
}

function renderDetail(id){
  const p = state.personById[id];
  const main = document.getElementById("main");
  if (!p) { currentPersonId = null; render(); return; }

  const eltern = parentsOf(p);
  const geschwister = siblingsOf(id, p);
  const kinder = childrenOf(id);

  main.innerHTML = `
    <button class="back-btn" id="backBtn">‹ Zurück zur Suche</button>

    <div class="tree">
      ${eltern.length ? `<div class="trow">${eltern.map(pid => tnode(pid)).join("")}</div><div class="tconn"></div>` : ""}
      <div class="trow">
        ${geschwister.map(pid => tnode(pid)).join("")}
        <div class="tunion">
          ${tnode(id, true)}
          ${p.ehepartner ? `<span class="sep">⚭</span><div class="tnode">${escapeHtml(p.ehepartner)}</div>` : ""}
        </div>
      </div>
      ${kinder.length ? `<div class="tconn"></div><div class="trow">${kinder.map(pid => tnode(pid)).join("")}</div>` : ""}
    </div>

    <div class="card">
      ${p.pruefen ? `<div style="background:#e6a028; color:#20201d; border-radius:8px; padding:8px 12px; font-size:13.5px; font-weight:600; margin-bottom:10px">⚠️ Diese Daten müssen noch überprüft werden</div>` : ""}
      <h2>${escapeHtml(personName(id))}</h2>
      ${p.maedchenname ? `<div class="meta">geb. ${escapeHtml(p.maedchenname)}</div>` : ""}
      ${p.beruf ? `<div class="meta">${escapeHtml(p.beruf)}</div>` : ""}
      <div class="meta">
        ${p.geburtsdatum ? "* " + fmtDate(p.geburtsdatum) : ""}
        ${p.todesdatum ? " † " + fmtDate(p.todesdatum) : ""}
      </div>
      <div class="section-label">Wohnorte</div>
      ${p.wohnorte ? `<div class="meta" style="white-space:pre-line">${escapeHtml(p.wohnorte)}</div>` : `<div class="meta">Keine Angabe</div>`}
      ${p.zweig ? `<div class="section-label">Zweig</div><div class="meta">${escapeHtml(p.zweig)}</div>` : ""}
      ${p.erwaehnt ? `<div class="section-label">Erwähnt</div><div class="meta">${escapeHtml(p.erwaehnt)}</div>` : ""}
      ${p.bemerkungen ? `<div class="section-label">Bemerkungen</div><div class="meta" style="white-space:pre-line">${escapeHtml(p.bemerkungen)}</div>` : ""}
      <div class="btn-row">
        <button class="btn secondary" id="editBtn">Bearbeiten</button>
        <button class="btn danger" id="deleteBtn">Löschen</button>
      </div>
    </div>
  `;
  document.getElementById("backBtn").addEventListener("click", () => { lastFocusPersonId = currentPersonId; currentPersonId = null; render(); });
  document.getElementById("editBtn").addEventListener("click", () => renderPersonForm(id));
  document.getElementById("deleteBtn").addEventListener("click", () => deletePerson(id));
  main.querySelectorAll("[data-person]").forEach(el => {
    el.addEventListener("click", () => { currentPersonId = el.dataset.person; render(); window.scrollTo(0,0); });
  });
}

function initSortControls(){
  const sel = document.getElementById("sortFieldSelect");
  sel.innerHTML = FIELDS.map(f => `<option value="${f.key}">Sortieren: ${f.label}</option>`).join("");
  sel.value = sortState.key;
  sel.addEventListener("change", () => {
    sortState.key = sel.value;
    if (!currentPersonId) renderList();
  });
  const dirBtn = document.getElementById("sortDirBtn");
  dirBtn.textContent = sortState.dir === 1 ? "▲" : "▼";
  dirBtn.addEventListener("click", () => {
    sortState.dir *= -1;
    dirBtn.textContent = sortState.dir === 1 ? "▲" : "▼";
    if (!currentPersonId) renderList();
  });
}

document.getElementById("settingsBtn").addEventListener("click", () => { if (isUnlocked()) renderSettingsModal(); });
document.getElementById("saveBtn").addEventListener("click", () => { if (isUnlocked()) handleSaveClick(); });
document.getElementById("printBtn").addEventListener("click", () => window.print());
document.getElementById("searchInput").addEventListener("input", () => { if (!currentPersonId) renderList(); });
document.getElementById("fabBtn").addEventListener("click", () => { if (isUnlocked()) renderPersonForm(null); });
window.addEventListener("resize", () => {
  updateStickyOffsets();
  if (!currentPersonId) updateScrollToolbarVisibility();
});
initSortControls();
updateSaveBtn();

if (!isUnlocked()) renderGate(); else loadAll();
</script>
</body>
