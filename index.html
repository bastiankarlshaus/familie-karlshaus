<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Familie Karlshaus</title>
<style>
  :root{
    --bg:#f5f4f1; --card:#ffffff; --text:#20201d; --muted:#6b675f;
    --accent:#8a5a2b; --accent-text:#ffffff; --border:#e3e0d8; --danger:#b3432b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#181715; --card:#232220; --text:#f0eee9; --muted:#a39c8f;
      --accent:#c98a4b; --accent-text:#181715; --border:#39362f; --danger:#e0705a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    position:sticky; top:0; z-index:5; background:var(--bg);
    padding:14px 16px 10px; border-bottom:1px solid var(--border);
  }
  h1{font-size:19px; margin:0 0 10px; display:flex; align-items:center; justify-content:space-between; gap:8px}
  h1 span.title{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .icon-btn{
    background:none; border:none; color:var(--muted); font-size:20px; padding:4px 6px;
    cursor:pointer; line-height:1;
  }
  .search-row{display:flex; gap:8px}
  input[type=text], input[type=password], input[type=date]{
    width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
    background:var(--card); color:var(--text); font-size:15px;
  }
  main{padding:12px 16px 40px; max-width:640px; margin:0 auto}
  .hint{color:var(--muted); font-size:13px; padding:24px 4px; text-align:center}
  .list{display:flex; flex-direction:column; gap:8px; margin-top:12px}
  .row{
    background:var(--card); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .row:active{opacity:.7}
  .row .name{font-weight:600}
  .row .sub{color:var(--muted); font-size:13px}
  .chip{
    display:inline-flex; align-items:center; background:var(--bg); border:1px solid var(--border);
    color:var(--text); border-radius:999px; padding:6px 12px; font-size:13.5px; cursor:pointer; margin:3px 4px 0 0;
  }
  .chip:active{opacity:.7}
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin-bottom:14px;
  }
  .card h2{margin:0 0 4px; font-size:22px}
  .card .meta{color:var(--muted); font-size:14px; margin-bottom:2px}
  .section-label{
    text-transform:uppercase; letter-spacing:.03em; font-size:11.5px; color:var(--muted);
    margin:16px 0 6px; font-weight:600;
  }
  .tree{margin:10px 0 20px}
  .trow{display:flex; flex-wrap:wrap; justify-content:center; gap:8px}
  .tunion{display:flex; align-items:center; gap:6px; flex-wrap:wrap; justify-content:center}
  .tunion .sep{color:var(--muted); font-size:14px}
  .tconn{width:2px; height:16px; background:var(--border); margin:2px auto}
  .tnode{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:7px 11px; font-size:13px; text-align:center; cursor:pointer; min-width:64px;
  }
  .tnode:active{opacity:.7}
  .tnode .yr{font-size:10.5px; opacity:.7; margin-top:1px}
  .tnode.self{border:2px solid var(--accent); font-weight:700; background:var(--accent); color:var(--accent-text)}
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:15px; cursor:pointer; padding:6px 0 12px;
    display:flex; align-items:center; gap:4px;
  }
  .fab{
    position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%; background:var(--accent); color:var(--accent-text);
    border:none; font-size:28px; box-shadow:0 4px 14px rgba(0,0,0,.25); cursor:pointer; z-index:6;
  }
  .modal-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end;
    justify-content:center; z-index:10;
  }
  @media (min-width:520px){ .modal-overlay{align-items:center} }
  .modal{
    background:var(--card); width:100%; max-width:480px; border-radius:16px 16px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom)); max-height:88vh; overflow:auto;
  }
  @media (min-width:520px){ .modal{border-radius:16px} }
  .modal h3{margin-top:0}
  .field{margin-bottom:14px}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px}
  .btn{
    padding:11px 16px; border-radius:10px; border:none; background:var(--accent); color:var(--accent-text);
    font-size:15px; font-weight:600; cursor:pointer;
  }
  .btn.secondary{background:none; color:var(--text); border:1px solid var(--border)}
  .btn-row{display:flex; gap:10px; margin-top:18px}
  .error{color:var(--danger); font-size:13.5px; margin-top:10px}
  .loading{color:var(--muted); text-align:center; padding:30px 0}
  a.form-link{color:var(--accent); text-decoration:none; font-size:13.5px}
</style>
</head>
<body>

<header>
  <h1><span class="title">🌳 Familie Karlshaus</span>
    <button class="icon-btn" id="settingsBtn" title="Einstellungen">⚙️</button>
  </h1>
  <div class="meta" style="margin:-6px 0 8px" id="versionLabel"></div>
  <div class="search-row">
    <input type="text" id="searchInput" placeholder="Person suchen (Vor- oder Nachname)…" autocomplete="off">
  </div>
</header>

<main id="main">
  <div class="hint">Lade Daten…</div>
</main>

<button class="fab" id="fabBtn" title="Neue Person erfassen">+</button>

<div id="modalRoot"></div>

<script>
const LS_KEY = "familie_karlshaus_config_v1";

function loadConfig(){
  try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch(e){ return {}; }
}
function saveConfig(cfg){
  localStorage.setItem(LS_KEY, JSON.stringify(cfg));
}

const APP_VERSION = "v4 · 17.09.2026 20:00";
document.getElementById("versionLabel").textContent = APP_VERSION;

const UNLOCK_KEY = "familie_karlshaus_unlocked";

async function sha256Hex(str){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,"0")).join("");
}

function isUnlocked(){
  return !config.pwHash || localStorage.getItem(UNLOCK_KEY) === config.pwHash;
}

function renderGate(){
  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="hint" style="padding-top:60px">
      <div style="font-size:32px; margin-bottom:12px">🔒</div>
      <div style="margin-bottom:14px">Bitte Passwort eingeben</div>
      <div style="max-width:280px; margin:0 auto">
        <input type="password" id="gatePw" placeholder="Passwort" style="text-align:center">
        <div class="error" id="gateError" style="display:none; margin-top:8px"></div>
        <button class="btn" id="gateSubmit" style="width:100%; margin-top:12px">Entsperren</button>
      </div>
    </div>`;
  const submit = async () => {
    const val = document.getElementById("gatePw").value;
    const hash = await sha256Hex(val);
    if (hash === config.pwHash) {
      localStorage.setItem(UNLOCK_KEY, hash);
      if (isConfigured()) loadAll(); else render();
    } else {
      const err = document.getElementById("gateError");
      err.textContent = "Falsches Passwort.";
      err.style.display = "block";
    }
  };
  document.getElementById("gateSubmit").addEventListener("click", submit);
  document.getElementById("gatePw").addEventListener("keydown", e => { if (e.key === "Enter") submit(); });
}

let config = loadConfig();
let state = {
  personen: [],
  personById: {},
  loaded: false, error: null
};

const TABLES = { personen: "Personen" };

async function airtableFetchAll(tableName){
  let records = [];
  let offset = undefined;
  do {
    const url = new URL(`https://api.airtable.com/v0/${config.baseId}/${encodeURIComponent(tableName)}`);
    url.searchParams.set("pageSize", "100");
    if (offset) url.searchParams.set("offset", offset);
    const res = await fetch(url, { headers: { Authorization: `Bearer ${config.token}` } });
    if (!res.ok) {
      const body = await res.text();
      throw new Error(`Airtable-Fehler bei Tabelle "${tableName}": ${res.status} ${body.slice(0,200)}`);
    }
    const data = await res.json();
    records = records.concat(data.records);
    offset = data.offset;
  } while (offset);
  return records;
}

function fieldArr(fields, name){
  const v = fields[name];
  return Array.isArray(v) ? v : (v ? [v] : []);
}

function personName(id){
  const p = state.personById[id];
  if (!p) return "(unbekannt)";
  return p.fields["Name"] || `${p.fields["Vorname"]||""} ${p.fields["Nachname"]||""}`.trim();
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function fmtDate(d){
  if (!d) return "";
  const [y,m,day] = d.split("-");
  return `${day}.${m}.${y}`;
}

async function loadAll(){
  state.error = null;
  state.loaded = false;
  render();
  try {
    const personen = await airtableFetchAll(TABLES.personen);
    state.personen = personen;
    state.personById = {};
    personen.forEach(p => state.personById[p.id] = p);
    state.loaded = true;
  } catch (err) {
    state.error = err.message;
  }
  render();
}

function isConfigured(){
  return config.baseId && config.token;
}

let currentPersonId = null;

function renderSettingsModal(){
  const root = document.getElementById("modalRoot");
  root.innerHTML = `
    <div class="modal-overlay" id="overlay">
      <div class="modal">
        <h3>Einstellungen</h3>
        <div class="field">
          <label>Airtable Base ID</label>
          <input type="text" id="cfgBaseId" value="${config.baseId||""}" placeholder="appXXXXXXXXXXXXXX">
        </div>
        <div class="field">
          <label>Airtable Personal Access Token (nur Lesen)</label>
          <input type="password" id="cfgToken" value="${config.token||""}" placeholder="patXXXXXXXXXXXXXX">
        </div>
        <div class="field">
          <label>Link zum Airtable-Eingabeformular (optional)</label>
          <input type="text" id="cfgFormUrl" value="${config.formUrl||""}" placeholder="https://airtable.com/app.../form">
        </div>
        <div class="field">
          <label>Neues Zugangspasswort setzen (leer lassen = unverändert)</label>
          <input type="password" id="cfgPassword" placeholder="Passwort">
        </div>
        ${config.pwHash ? `<button class="btn secondary" id="cfgRemovePw" style="margin-bottom:10px">Passwortschutz entfernen</button>` : ""}
        <div class="error" id="cfgError" style="display:none"></div>
        <div class="btn-row">
          <button class="btn" id="cfgSave">Speichern</button>
          <button class="btn secondary" id="cfgCancel">Abbrechen</button>
        </div>
        ${isConfigured() ? `
        <hr style="border:none; border-top:1px solid var(--border); margin:18px 0">
        <div class="field" style="margin-bottom:8px">
          <label>Setup-Link (für neue Geräte, z.B. in OneDrive speichern)</label>
          <button class="btn secondary" id="cfgMakeLink" style="width:100%">Setup-Link erzeugen</button>
        </div>
        <textarea id="cfgLinkOut" readonly style="display:none; width:100%; height:70px; margin-top:6px; padding:8px; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:12px"></textarea>
        <div class="meta" id="cfgLinkHint" style="display:none; margin-top:6px">Enthält deine Zugangsdaten unverschlüsselt (nur codiert) – vertraulich behandeln, nicht öffentlich teilen.</div>
        ` : ""}
      </div>
    </div>`;
  document.getElementById("overlay").addEventListener("click", (e) => {
    if (e.target.id === "overlay") closeModal();
  });
  document.getElementById("cfgCancel").addEventListener("click", closeModal);
  const removeBtn = document.getElementById("cfgRemovePw");
  if (removeBtn) removeBtn.addEventListener("click", () => {
    delete config.pwHash;
    saveConfig(config);
    localStorage.removeItem(UNLOCK_KEY);
    closeModal();
    render();
  });
  const makeLinkBtn = document.getElementById("cfgMakeLink");
  if (makeLinkBtn) makeLinkBtn.addEventListener("click", () => {
    const payload = btoa(unescape(encodeURIComponent(JSON.stringify(config))));
    const url = `${location.origin}${location.pathname}?setup=${payload}`;
    const out = document.getElementById("cfgLinkOut");
    out.style.display = "block";
    out.value = url;
    out.select();
    document.getElementById("cfgLinkHint").style.display = "block";
    if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
  });
  document.getElementById("cfgSave").addEventListener("click", async () => {
    const baseId = document.getElementById("cfgBaseId").value.trim();
    const token = document.getElementById("cfgToken").value.trim();
    const formUrl = document.getElementById("cfgFormUrl").value.trim();
    const newPassword = document.getElementById("cfgPassword").value;
    if (!baseId.startsWith("app") || !token.startsWith("pat")) {
      const err = document.getElementById("cfgError");
      err.textContent = "Bitte eine gültige Base ID (beginnt mit 'app') und ein gültiges Token (beginnt mit 'pat') eingeben.";
      err.style.display = "block";
      return;
    }
    const pwHash = newPassword ? await sha256Hex(newPassword) : config.pwHash;
    config = { baseId, token, formUrl, pwHash };
    saveConfig(config);
    if (newPassword) localStorage.setItem(UNLOCK_KEY, pwHash);
    closeModal();
    loadAll();
  });
}

function closeModal(){
  document.getElementById("modalRoot").innerHTML = "";
}

function render(){
  const main = document.getElementById("main");

  if (!isConfigured()) {
    main.innerHTML = `<div class="hint">Noch nicht eingerichtet.<br>Tippe oben rechts auf ⚙️, um Base ID und Zugriffstoken einzutragen.</div>`;
    return;
  }
  if (state.error) {
    main.innerHTML = `<div class="hint error">${state.error}<br><br>Bitte Einstellungen (⚙️) prüfen.</div>`;
    return;
  }
  if (!state.loaded) {
    main.innerHTML = `<div class="loading">Lade Familiendaten…</div>`;
    return;
  }

  if (currentPersonId) {
    renderDetail(currentPersonId);
    return;
  }

  renderList();
}

function renderList(){
  const main = document.getElementById("main");
  const q = document.getElementById("searchInput").value.trim().toLowerCase();
  const items = state.personen
    .map(p => ({ p, name: personName(p.id) }))
    .filter(x => !q || x.name.toLowerCase().includes(q))
    .sort((a,b) => a.name.localeCompare(b.name, "de"));

  if (!q) {
    main.innerHTML = `<div class="hint">${state.personen.length} Personen in der Datenbank. Oben suchen oder unten scrollen.</div>` + listHtml(items);
  } else if (items.length === 0) {
    main.innerHTML = `<div class="hint">Keine Treffer für "${q}".</div>`;
  } else {
    main.innerHTML = listHtml(items);
  }

  main.querySelectorAll("[data-person]").forEach(el => {
    el.addEventListener("click", () => { currentPersonId = el.dataset.person; render(); window.scrollTo(0,0); });
  });
}

function listHtml(items){
  return `<div class="list">${items.map(({p,name}) => {
    const f = p.fields;
    const sub = [f["Beruf"], f["Geburtsdatum"] ? fmtDate(f["Geburtsdatum"]) : null].filter(Boolean).join(" · ");
    return `<div class="row" data-person="${p.id}">
      <div><div class="name">${name}</div><div class="sub">${sub}</div></div>
      <div class="sub">›</div>
    </div>`;
  }).join("")}</div>`;
}

function chipHtml(id){
  return `<span class="chip" data-person="${id}">${personName(id)}</span>`;
}

function chipsOrNone(ids){
  return ids.length ? ids.map(chipHtml).join("") : `<div class="meta">Keine Angabe</div>`;
}

function tnode(id, isSelf){
  const p = state.personById[id];
  const year = p && p.fields["Geburtsdatum"] ? p.fields["Geburtsdatum"].slice(0,4) : "";
  return `<div class="tnode${isSelf?' self':''}" data-person="${id}">
    <div>${personName(id)}</div>
    ${year ? `<div class="yr">*${year}</div>` : ""}
  </div>`;
}

function parentsOf(f){
  return [...fieldArr(f,"Mutter"), ...fieldArr(f,"Vater")];
}

function siblingsOf(id, f){
  const mutter = fieldArr(f,"Mutter")[0];
  const vater = fieldArr(f,"Vater")[0];
  if (!mutter && !vater) return [];
  const set = new Set();
  state.personen.forEach(other => {
    if (other.id === id) return;
    const om = fieldArr(other.fields,"Mutter")[0];
    const ov = fieldArr(other.fields,"Vater")[0];
    if ((mutter && om === mutter) || (vater && ov === vater)) set.add(other.id);
  });
  return [...set];
}

function childrenOf(id){
  const set = new Set();
  state.personen.forEach(other => {
    if (fieldArr(other.fields,"Mutter")[0] === id || fieldArr(other.fields,"Vater")[0] === id) set.add(other.id);
  });
  return [...set];
}

function spouseIdsOf(f){
  return [...new Set([...fieldArr(f,"Ehepartner"), ...fieldArr(f,"From field: Ehepartner")])];
}

function renderDetail(id){
  const p = state.personById[id];
  const main = document.getElementById("main");
  if (!p) { currentPersonId = null; render(); return; }
  const f = p.fields;

  const eltern = parentsOf(f);
  const geschwister = siblingsOf(id, f);
  const ehepartner = spouseIdsOf(f);
  const kinder = childrenOf(id);

  main.innerHTML = `
    <button class="back-btn" id="backBtn">‹ Zurück zur Suche</button>

    <div class="tree">
      ${eltern.length ? `<div class="trow">${eltern.map(pid => tnode(pid)).join("")}</div><div class="tconn"></div>` : ""}
      <div class="trow">
        ${geschwister.map(pid => tnode(pid)).join("")}
        <div class="tunion">
          ${tnode(id, true)}
          ${ehepartner.map(pid => `<span class="sep">⚭</span>${tnode(pid)}`).join("")}
        </div>
      </div>
      ${kinder.length ? `<div class="tconn"></div><div class="trow">${kinder.map(pid => tnode(pid)).join("")}</div>` : ""}
    </div>

    <div class="card">
      <h2>${personName(id)}</h2>
      ${f["Mädchenname"] ? `<div class="meta">geb. ${escapeHtml(f["Mädchenname"])}</div>` : ""}
      ${f["Beruf"] ? `<div class="meta">${escapeHtml(f["Beruf"])}</div>` : ""}
      <div class="meta">
        ${f["Geburtsdatum"] ? "* " + fmtDate(f["Geburtsdatum"]) : ""}
        ${f["Todesdatum"] ? " † " + fmtDate(f["Todesdatum"]) : ""}
        ${f["Alter"] != null ? ` (${f["Alter"]} Jahre)` : ""}
      </div>
      ${f["Kennzeichen"] ? `<div class="meta">${escapeHtml(f["Kennzeichen"])}</div>` : ""}
      ${f["Hochzeitsdatum"] ? `<div class="section-label">Hochzeitsdatum</div><div class="meta" style="white-space:pre-line">${escapeHtml(f["Hochzeitsdatum"])}</div>` : ""}

      <div class="section-label">Wohnorte</div>
      ${f["Wohnorte"] ? `<div class="meta" style="white-space:pre-line">${escapeHtml(f["Wohnorte"])}</div>` : `<div class="meta">Keine Angabe</div>`}
    </div>
  `;

  document.getElementById("backBtn").addEventListener("click", () => { currentPersonId = null; render(); });
  main.querySelectorAll("[data-person]").forEach(el => {
    el.addEventListener("click", () => { currentPersonId = el.dataset.person; render(); window.scrollTo(0,0); });
  });
}

document.getElementById("settingsBtn").addEventListener("click", () => { if (isUnlocked()) renderSettingsModal(); });
document.getElementById("searchInput").addEventListener("input", () => { if (!currentPersonId) renderList(); });
document.getElementById("fabBtn").addEventListener("click", () => {
  if (config.formUrl) {
    window.open(config.formUrl, "_blank");
  } else {
    renderSettingsModal();
  }
});

function applySetupLinkFromUrl(){
  const params = new URLSearchParams(location.search);
  const payload = params.get("setup");
  if (!payload) return false;
  try {
    config = JSON.parse(decodeURIComponent(escape(atob(payload))));
    saveConfig(config);
  } catch (e) { /* ignoriere ungültigen Link */ }
  history.replaceState(null, "", location.pathname);
  return true;
}

applySetupLinkFromUrl();
if (!isUnlocked()) renderGate(); else if (isConfigured()) loadAll(); else render();
</script>
</body>
</html>
